name: CI

on: [push, pull_request]

jobs:
  integration-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Устанавливаем Node.js для Newman
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Newman
        run: npm install -g newman newman-reporter-htmlextra

      - name: Build and start containers
        run: |
          docker compose up -d --build
          # Ждем пока БД и API поднимутся
          sleep 15
          # Проверяем health API (если есть endpoint /health)
          until curl -s http://localhost:8000/health; do 
            echo "Waiting for API..." 
            sleep 2 
          done

      - name: Run Integration Tests
        run: newman run tests/integration.json --reporters cli

      - name: Cleanup
        if: always()
        run: docker compose down -v