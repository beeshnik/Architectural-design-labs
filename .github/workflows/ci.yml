name: CI - Build Docker Images

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  # Сборка бэкенда
  build-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Собираем образ бэкенда
      - name: Build Backend
        run: |
          docker build ./Lab4 -t trading-journal-backend:latest

  # Сборка фронтенда  
  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Frontend
        run: |
          docker build ./Lab5 -t trading-journal-frontend:latest

  # Проверка docker-compose (собирается ли всё вместе)
  test-compose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build all services
        run: |
          docker-compose -f docker-compose.yml build