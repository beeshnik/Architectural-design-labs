services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: trading-journal-frontend
    ports:
      - "80:80"
    environment:
      - NODE_ENV=production
      - VITE_API_URL=http://localhost:8000
    networks:
      - trading-network
    restart: unless-stopped

networks:
  trading-network:
    driver: bridge